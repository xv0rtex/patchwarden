server {
    listen 80;
    root /var/www/html;
    index index.php;

    # --- Modo mantenimiento controlado por el vigilante -------------------
    # El vigilante crea /mantenimiento/ACTIVO en el volumen compartido.
    # Si existe, todo responde 503 con la página de mantenimiento.
    error_page 503 @mantenimiento;
    location @mantenimiento {
        root /mantenimiento;
        rewrite ^ /mantenimiento.html break;
    }
    # -----------------------------------------------------------------------

    location / {
        if (-f /mantenimiento/ACTIVO) { return 503; }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        if (-f /mantenimiento/ACTIVO) { return 503; }
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include fastcgi_params;
    }
}

# Puerto INTERNO (no publicado) para que el vigilante compruebe la web tras aplicar un cambio,
# aunque el modo mantenimiento esté activo.
server {
    listen 8081;
    root /var/www/html;
    index index.php;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include fastcgi_params;
    }
}
